<!doctype html><meta charset=utf-8>
<body style="margin:0;background:#888">
<iframe id=f style="width:1440px;height:900px;border:0;display:block"></iframe>
<script>
const q=new URLSearchParams(location.search);
const f=document.getElementById('f');
f.src=q.get('p')||'/';
const y=+(q.get('y')||0);
f.onload=()=>setTimeout(()=>{f.contentWindow.scrollTo(0,y);},1800);
</script>
</body>
